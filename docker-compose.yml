version: '3.8'

services:
  # 1. Backend Service (Spring Boot 3)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbanfix-backend
    restart: always
    ports:
      - "5050:5050"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: "*"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-urbanfix-uploads}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  # 2. Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: urbanfix-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
