version: '3.8'

services:
  # 1. Database Service (MySQL 8)
  db:
    image: mysql:8.0
    container_name: urbanfix-db
    restart: always
    environment:
      MYSQL_DATABASE: urbanfix_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-4321}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend Service (Spring Boot 3)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbanfix-backend
    restart: always
    ports:
      - "5050:5050"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/urbanfix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-4321}
      APP_CORS_ALLOWED_ORIGINS: "*"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-urbanfix-uploads}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: urbanfix-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
