spring.application.name=urbanfix-backend

# Database Configuration (Auto-detects PostgreSQL on Render or local MySQL from JDBC URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/urbanfix_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:4321}

# JPA / Hibernate Configuration (Dialect auto-detected)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port (Render dynamically sets PORT)
server.port=5050

# Allowed CORS origins (comma-separated if multiple)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Maximum size of uploaded files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Automatically import local secret properties file if present (ignored by Git)
spring.config.import=optional:file:application-local.properties

# Groq API Key for automatic complaint classification & severity triage
groq.api.key=${GROQ_API_KEY:}

# Storage Configuration (s3 or local). seting up  proeprty key for storage location
# storage.provider is variable that is used internally by backend code 
# but STORAGE_PROVIDER is the External environmental variable used by docker 
#holds either string s3 or local 
storage.provider=${STORAGE_PROVIDER:s3}

# AWS S3 Configurations
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:urbanfix-uploads}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}


#"Spring, set storage.provider to whatever value is stored in the System Environment Variable STORAGE_PROVIDER.
# But if no such variable exists on the system, default to 's3'.