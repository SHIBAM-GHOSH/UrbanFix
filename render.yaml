# Render Infrastructure-as-Code Blueprint for UrbanFix
# Learn more: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------
  # 1. Spring Boot Backend Service (Docker)
  # ----------------------------------------------------
  - type: web
    name: urbanfix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: urbanfix-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: urbanfix-frontend
          property: host

  # ----------------------------------------------------
  # 2. React Vite Frontend (Static Site)
  # ----------------------------------------------------
  - type: web
    name: urbanfix-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: urbanfix-backend
          property: host
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_MAP_ID
        value: DEMO_MAP_ID

# ------------------------------------------------------
# 3. Managed PostgreSQL Database
# ------------------------------------------------------
databases:
  - name: urbanfix-db
    databaseName: urbanfix_db
    user: urbanfix_user
    region: singapore
    plan: free

